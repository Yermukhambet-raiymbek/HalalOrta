# The live demo runs on a free Render instance, which goes to sleep after
# 15 minutes without traffic and then takes about a minute to wake up.
# This job asks the health endpoint every few minutes so the first visitor
# does not have to wait. It can be deleted once the app is on a paid plan.
name: Keep the live demo awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the health endpoint
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://halalorta.onrender.com/api/health
